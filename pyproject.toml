[project]
name = "aichat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aichat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
aichat-server = "aichat.adapters.inbound.network.server:run"